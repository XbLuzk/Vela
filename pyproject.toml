[project]
name = "vela-agent"
version = "0.3.0"
description = "Vela terminal AI agent with an explicit ReAct loop, LangGraph planning, MCP, memory, and multimodal input"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vela Contributors" }]
keywords = ["agent", "ai", "cli", "llm", "mcp", "react", "terminal"]
dependencies = [
  "aiosqlite>=0.22,<1",
  "filelock>=3.16,<4",
  "httpx>=0.27.0",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "mcp>=1.27,<2",
  "pillow>=10.0",
  "prompt-toolkit>=3.0.43",
  "pydantic>=2,<3",
  "rich>=13.7.0",
  "typer>=0.12.3",
]

[project.scripts]
vela = "vela.entrypoints.cli:app"
vela-rag = "vela_rag.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/vela", "src/vela_rag"]

[tool.hatch.build.targets.sdist]
include = [
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/docs",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: calls real external model, MCP, or browser dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
